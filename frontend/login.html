<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Sign in to your Royal Cuts account." />
    <title>Sign In — Royal Cuts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body>
    <div data-site-header></div>
    <main class="auth-page">
      <section class="auth-visual">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Your ritual<br /><em>continues.</em></h1>
        <p>Sign in to view your Royal Cuts appointments.</p>
      </section>
      <section class="auth-panel">
        <div class="form-card auth-card">
          <p class="eyebrow">MEMBER SIGN IN</p>
          <h2>Good to have<br />you <em>back.</em></h2>
          <form id="login-form" class="form-grid">
            <label class="field field-wide"
              >Email address<input
                name="email"
                type="email"
                required
                maxlength="254"
                autocomplete="email" /></label
            ><label class="field field-wide"
              >Password<input
                name="password"
                type="password"
                required
                maxlength="128"
                autocomplete="current-password"
            /></label>
            <p
              id="auth-message"
              class="form-message field-wide"
              role="status"
            ></p>
            <button class="button button-gold field-wide" type="submit">
              Sign in <span>↗</span>
            </button>
          </form>
          <p class="auth-foot">
            New to Royal Cuts? <a href="/signup.html">Create an account</a>
          </p>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
